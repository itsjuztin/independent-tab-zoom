<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-title">Independent Tab Zoom</span>
        <span class="tab-target" id="tabTarget">Active Tab</span>
      </div>
      <button class="reset-link-btn" id="btnReset">Reset (100%)</button>
    </header>

    <!-- Main Stepper Box -->
    <div class="control-box">
      <div class="zoom-stepper">
        <button class="step-btn" id="btnMinus" title="Zoom out (-10%)">-</button>
        <div class="zoom-readout"><span id="zoomPercent">100</span>%</div>
        <button class="step-btn" id="btnPlus" title="Zoom in (+10%)">+</button>
      </div>

      <div class="slider-wrapper">
        <input type="range" id="zoomSlider" min="25" max="300" step="5" value="100" class="native-slider">
      </div>

      <div class="preset-grid">
        <button class="preset-btn" data-zoom="75">75%</button>
        <button class="preset-btn" data-zoom="90">90%</button>
        <button class="preset-btn active" data-zoom="100">100%</button>
        <button class="preset-btn" data-zoom="125">125%</button>
        <button class="preset-btn" data-zoom="150">150%</button>
        <button class="preset-btn" data-zoom="200">200%</button>
      </div>
    </div>

    <!-- Footer Feedback Link -->
    <footer class="app-footer-row">
      <a href="https://github.com/itsjuztin/independent-tab-zoom/issues" target="_blank" class="footer-link">Report an issue / suggest a feature</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
